services:
  - type: web
    name: qaqpan
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: XKIRO_API_KEY
        sync: false
      # the presenter opens /director?key=<value> once; without it nobody else can reset or drive the demo
      - key: QAQPAN_DIRECTOR_KEY
        generateValue: true
      - key: QAQPAN_DEMO
        value: "0"
      - key: QAQPAN_LLM_DAILY
        value: "500"
